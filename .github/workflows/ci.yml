name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  es-fluent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Check FTL files
        uses: stayhydated/es-fluent/crates/es-fluent-cli@es-fluent-cli-v0.21.0
        with:
          toolchain: stable
          path: .
          all_locales: true
          ignore: |
            some-lib

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --check

      - name: Check consumer fixture formatting
        run: rustfmt --check --edition 2024 .github/feature-smoke.rs

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Lint code
        run: cargo clippy --workspace --all-features --exclude some-lib-forms --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Verify publishable package builds
        run: cargo publish --workspace --dry-run --locked

  machete:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"
      - name: Install cargo-machete
        run: cargo binstall cargo-machete --version '=0.9.2' --locked --no-confirm
      - name: Check unused dependencies
        run: cargo machete

  rust-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: 1.25.1

      - name: Install cargo-llvm-cov
        shell: bash
        run: cargo binstall cargo-llvm-cov --version 0.9.1 --locked --no-confirm

      - name: Run coverage
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --locked --cobertura --output-path=target/cobertura.xml --exclude gpui-form-component-story --exclude some-lib-forms --exclude prototyping

      - name: Codecov publish
        uses: codecov/codecov-action@v7
        with:
          files: target/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov housekeeping
        shell: bash
        run: |
          rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig

  quality:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Taplo and ShellCheck
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: "taplo@0.10.0,shellcheck@0.11.0"
          checksum: true
          fallback: none
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check Markdown
        uses: rvben/rumdl@v0.2.79
        with:
          version: "0.2.78"
          command: check
          path: "."
          fail-on-error: "true"
      - name: Prevent checkout-controlled typos executable reuse
        run: test ! -e typos && test ! -L typos
      - name: Check spelling
        uses: crate-ci/typos@v1.42.3
        with:
          write_changes: false
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"
      - name: Install derive sorter
        run: cargo binstall cargo-sort-derives --version '=0.13.0' --locked --no-confirm
      - name: Check derive order
        run: cargo sort-derives --check
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12 # includes ShellCheck and pyflakes
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  dependencies:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1 # cargo-deny 0.20.2
        with:
          rust-version: stable
          arguments: "--workspace --all-features --locked"
          command: check
          command-arguments: "advisories sources"

  feature-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: ./.github/actions/install-linux-deps
      - name: Check isolated facade consumers
        run: bash .github/scripts/check-features.sh

  scaffolds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: ./.github/actions/install-linux-deps
      - name: Check deterministic scaffold regeneration
        run: bash .github/scripts/check-scaffolds.sh

  publication:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      MDBOOK_BUILD__CREATE_MISSING: "false"
      TRUNK_SKIP_VERSION_CHECK: "true"
      TRUNK_BUILD_LOCKED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-linux-deps
      - name: Install nightly for the existing GPUI Wasm demo
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: 1.25.1
      - name: Install publication tools
        run: |
          cargo binstall dioxus-cli --version 0.7.9 --locked --no-confirm
          cargo binstall trunk --version 0.21.14 --locked --no-confirm
      - name: Check the committed dependency lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build demo, book, LLM documentation and assembled site
        run: |
          cargo run -p xtask --locked -- build gpui-demo
          cargo run -p xtask --locked -- build book
          cargo run -p xtask --locked -- build llms-txt
          cargo run -p xtask --locked -- build web
      - name: Check dependency lockfiles stayed unchanged
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [es-fluent, test, fmt, clippy, docs, package, machete, rust-coverage, quality, dependencies, feature-consumers, scaffolds, publication]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Publish unpublished crate versions
        uses: release-plz/action@v0.5.133
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}
