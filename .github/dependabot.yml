version: 2

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      all-github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["ci/cd", "github-actions"]
    assignees: ["stayhydated"]
    ignore:
      # Preserve the existing checkout major-update policy.
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # CI intentionally follows this mutable stable channel.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      all-cargo-majors:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "rust"]
    assignees: ["stayhydated"]
    # Retain the existing major-only Cargo version-update policy.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
