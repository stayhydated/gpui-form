# Advisory and source checks use the complete, locked workspace graph.
# No repository-wide license acceptance policy has been established.
[advisories]
# Limit unmaintained notices to immediate workspace dependencies. Vulnerability,
# yanked and source checks still cover the complete dependency graph.
unmaintained = "workspace"

[sources]
allow-git = [
  "https://github.com/DioxusLabs/components",
  "https://github.com/stayhydated/shared",
  "https://github.com/stayhydated/component-shape",
  "https://github.com/stayhydated/gpui-es-fluent",
  "https://github.com/stayhydated/gpui-storybook",
]
unknown-git = "deny"
unknown-registry = "deny"
