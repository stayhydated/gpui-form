[package]
name = "gpui-form-mcp"
description = """
Experimental MCP submit integration for gpui-form
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = [ "gpui", "gpui-kit", "form", "mcp" ]

[features]
default = [  ]
jiff = [ "component-shape-mcp/jiff" ]
rust_decimal = [ "component-shape-mcp/rust_decimal" ]

[dependencies]
component-shape-mcp = { workspace = true }
gpui-form-schema = { workspace = true }
inventory = { workspace = true }
rmcp = { workspace = true }
serde = { features = [ "derive" ], workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jiff = { workspace = true }
proptest = { default-features = false, features = [ "std" ], version = "1.12.0" }
rust_decimal = { workspace = true }

[lints]
workspace = true
