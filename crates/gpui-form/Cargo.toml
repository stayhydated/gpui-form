[package]
name = "gpui-form"
description = """
The gpui-form crate
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = [ "gpui", "gpui-kit", "form" ]

[features]
chrono = [ "gpui-form-mcp?/chrono" ]
default = [ "derive", "runtime" ]
derive = [ "dep:gpui-form-derive", "dep:strum" ]
inventory = [ "gpui-form-derive?/inventory" ]
mcp = [ "dep:gpui-form-mcp", "inventory", "gpui-form-derive?/mcp" ]
runtime = [ "dep:gpui-form-runtime" ]
rust_decimal = [ "gpui-form-mcp?/rust_decimal" ]

[dependencies]
bon = { workspace = true }
gpui-form-core = { workspace = true }
gpui-form-derive = { optional = true, workspace = true }
gpui-form-mcp = { optional = true, workspace = true }
gpui-form-runtime = { optional = true, workspace = true }
gpui-form-schema = { workspace = true }
strum = { features = [ "derive" ], optional = true, workspace = true }

[dev-dependencies]
chrono = { workspace = true }
gpui-kit = { features = [ "test-support" ], workspace = true }
gpui-form-collection = { workspace = true }
gpui-form-component = { features = [ "component-shape" ], workspace = true }
koruma = { workspace = true }
koruma-collection = { workspace = true }
rust_decimal = { workspace = true }
serde = { features = [ "derive" ], workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
