[package]
name = "gpui-form-derive"
description = """
Macro crate for gpui-form
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
component-shape = { workspace = true }
darling = { workspace = true }
gpui-form-codegen = { workspace = true }
koruma-derive-core = { workspace = true }
proc-macro-error2 = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { features = [ "full" ], workspace = true }
syn-cfg-attr = { workspace = true }

[lints]
workspace = true

[features]
default = [  ]
inventory = [  ]
mcp = [ "inventory" ]

[dev-dependencies]
component-shape = { workspace = true }
component-shape-gpui = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-form = { default-features = false, features = [ "derive", "mcp" ], path = "../gpui-form" }
gpui-form-runtime = { workspace = true }
insta = { workspace = true }
koruma = { workspace = true }
koruma-collection = { workspace = true }
prettyplease = { workspace = true }
serde = { features = [ "derive" ], workspace = true }
strum = { workspace = true }
trybuild = "1.0"
