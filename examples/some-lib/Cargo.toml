[package]
name = "some-lib"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license = "Unlicense"
publish = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
derive_more = { features = [ "full" ], workspace = true }
es-fluent = { workspace = true }
es-fluent-lang = { workspace = true }
es-fluent-manager-embedded = { workspace = true }
gpui-kit = { workspace = true }
gpui-es-fluent = { workspace = true }
gpui-form-component = { features = [ "component-shape", "derive" ], workspace = true }
gpui-form = { features = [ "derive" ], workspace = true }
gpui-form-collection = { workspace = true }
gpui-form-collection-derive = { workspace = true }
koruma = { features = [ "fluent" ], workspace = true }
koruma-collection = { features = [ "rust_decimal", "email", "fluent" ], workspace = true }
rust_decimal = { workspace = true }
strum = { workspace = true }

[build-dependencies]
es-fluent-build = { workspace = true }

[dev-dependencies]
gpui-kit = { features = [ "test-support" ], workspace = true }

[features]
default = [ "fluent", "ui", "validation" ]
fluent = [  ]
ui = [  ]
validation = [  ]

[package.metadata.cargo-machete]
ignored = [ "gpui-kit" ]

[lints]
workspace = true
